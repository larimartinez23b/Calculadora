<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Estética</title>
    <style>
        /* === NUEVO DISEÑO (CSS) === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Geneva, Verdana, sans-serif;
        }

        body {
            /* Fondo floral/estético suave */
            background-image: url('https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator-card {
            background-color: rgba(255, 240, 245, 0.85); /* Color claro translúcido (LavenderBlush) */
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 15px 35px rgba(255, 182, 193, 0.4); /* Sombra rosada suave */
            color: #4a044e; /* Texto morado oscuro para buen contraste */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        h2 {
            text-align: center;
            color: #701a75;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #86198f;
            font-size: 14px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.9); /* Fondo de input blanco */
            border: 2px solid #fbcfe8; /* Borde rosado claro */
            color: #4a044e;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: #f472b6; /* Borde rosa más fuerte al enfocar */
            box-shadow: 0 0 8px rgba(244, 114, 182, 0.3);
        }
        
        /* Ocultar flechas del input number */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            border: none;
            padding: 12px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:hover, .btn-clear:hover {
            opacity: 0.9;
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }

        .btn:active, .btn-clear:active {
            transform: scale(0.96);
        }

        /* Nueva paleta de colores pasteles y vibrantes */
        .btn-suma { background-color: #f472b6; } /* Rosa */
        .btn-resta { background-color: #c084fc; } /* Lavanda/Morado */
        .btn-multi { background-color: #fb7185; } /* Melocotón/Rosa fuerte */
        .btn-div { background-color: #2dd4bf; } /* Turquesa suave */

        .btn-clear {
            width: 100%;
            border: none;
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(to right, #ec4899, #8b5cf6); /* Degradado rosa a morado */
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #resultado-box {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(250, 232, 255, 0.9); /* Caja de resultado violeta muy claro */
            border: 2px dashed #f0abfc; /* Borde punteado lindo */
            border-radius: 12px;
            text-align: center;
            display: none;
            color: #701a75;
        }
        
        #resultado-box h3 {
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <h2>✨ Calculadora</h2>
        
        <div class="input-group">
            <label>Primer Número:</label>
            <input type="number" id="num1" placeholder="Ej. 10">
        </div>

        <div class="input-group">
            <label>Segundo Número:</label>
            <input type="number" id="num2" placeholder="Ej. 5">
        </div>

        <div class="buttons-grid">
            <button onclick="calcular('suma')" class="btn btn-suma">🌸 Suma</button>
            <button onclick="calcular('resta')" class="btn btn-resta">🌷 Resta</button>
            <button onclick="calcular('multiplicacion')" class="btn btn-multi">🎀 Multiplicación</button>
            <button onclick="calcular('division')" class="btn btn-div">🦋 División</button>
        </div>

        <button onclick="limpiar()" class="btn-clear">✨ Limpiar todo</button>

        <div id="resultado-box">
            <h3>Resultado: <span id="resultado">0</span></h3>
        </div>
    </div>

    <script>
        // === JAVASCRIPT ===
        function calcular(operacion) {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const resultadoBox = document.getElementById('resultado-box');
            const resultadoText = document.getElementById('resultado');

            if (isNaN(num1) || isNaN(num2)) {
                alert("Por favor, ingresa ambos números. 💕");
                return;
            }

            let resultado = 0;

            switch (operacion) {
                case 'suma': resultado = num1 + num2; break;
                case 'resta': resultado = num1 - num2; break;
                case 'multiplicacion': resultado = num1 * num2; break;
                case 'division': 
                    if (num2 === 0) {
                        alert("Oops, no se puede dividir entre cero. 🚫");
                        return;
                    }
                    resultado = num1 / num2; 
                    break;
            }

            // Mostrar máximo 2 decimales si no es entero
            resultadoText.innerText = Number.isInteger(resultado) ? resultado : resultado.toFixed(2);
            resultadoBox.style.display = "block";
        }

        function limpiar() {
            document.getElementById('num1').value = "";
            document.getElementById('num2').value = "";
            document.getElementById('resultado-box').style.display = "none";
        }
    </script>
</body>
</html>
